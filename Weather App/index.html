<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="location-container"><div class="location-icon"></div><p id="local">location</p></div>
        <div class="weather-container">
            <div class="weather-icon"></div>
            <h1 id="temp">32</h1>
            <h3 id="climate">Thunderstorm</h3>
            <p id="current-day">Monday, 17 May</p>
        </div>
        <div class="info-container">
            <div class="wind">
                <div class="wind-icon"></div>
                <p id="wind-speed"></p>
                <p>Wind</p>
            </div>
            <div class="humidity-container">
                <div class="humidity-icon"></div>
                <p id="humidity"></p>
                <p>humidity</p>
            </div>
            <div class="feels-like-container">
                <div class="feels-like-icon"></div>
                <p id="feels-like"></p>
                <p>feels-like</p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
